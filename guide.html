<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第一次看福位，为什么不建议只看价格？ | Perpetual Memorial Park</title>
<meta name="description" content="价格当然重要。但地点、环境、类型和家人的实际需求，也会影响最后的选择。">
<meta name="theme-color" content="#8A3200">
<link rel="icon" href="https://www.perpetual.com.my/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/pmp.css">
<style>
  body{display:flex;flex-direction:column;min-height:100svh}
  .hero{padding:22px clamp(20px,6vw,64px) clamp(40px,7vw,64px);max-width:680px;flex:1}
  .hero .logo-h{margin-bottom:clamp(30px,6vh,56px)}
  .hero h1{font-weight:500;color:var(--pmp-ink);font-size:clamp(27px,7vw,42px);line-height:1.42;letter-spacing:.015em;margin:12px 0 16px}
  .hero h1 em{font-style:normal;color:var(--ci-accent)}
  .hero p{max-width:28em;font-size:15.5px;margin-bottom:26px}
  .hero .btn{width:100%;font-size:15.5px;padding:1em}
  @media(min-width:560px){.hero .btn{width:auto;padding:1em 2em}}
  .note{margin-top:12px;font-size:13px;color:var(--ci-grey)}
  .env-wrap{padding:0 clamp(20px,6vw,64px) clamp(44px,8vw,64px);max-width:680px}
  .hero-visual{display:none}
  /* desktop: two-column hero with photography */
  @media(min-width:900px){
    .hero{max-width:1120px;margin:0 auto;width:100%}
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
    .hero-visual{display:block;border-radius:22px;overflow:hidden;
      border:1px solid var(--pmp-line);box-shadow:var(--shadow-panel);margin:0}
    .hero-visual img{width:100%;aspect-ratio:4/3.4;object-fit:cover;display:block}
    .env-wrap{max-width:1120px;margin:0 auto;width:100%}
    .env-band img{aspect-ratio:16/8}
  }
</style>
</head>
<body class="lattice">

<header class="hero">
  <img class="logo-h" src="assets/Perpetual_Logo_Horizontal.jpg" alt="萬富 Perpetual Memorial Park">
  <div class="hero-grid">
    <div>
      <span class="eyebrow">先别急着问价格</span>
      <h1>第一次看福位，<br>为什么不建议<em>只看价格</em>？</h1>
      <p>价格当然重要。但地点、环境、类型和家人的实际需求，也会影响最后的选择。</p>
      <a class="btn btn-primary" id="continue" href="index.html#steps">看看选福位前要了解什么 →</a>
      <p class="note">4 个步骤，几分钟看完。不用留下任何资料。</p>
    </div>
    <figure class="hero-visual" aria-hidden="true">
      <img src="https://cms.perpetual.com.my/assets/images/heng-ding-lou/_banner1920X1078/22010/1920x1080-HDL-04.webp" alt="">
    </figure>
  </div>
</header>

<div class="env-wrap">
  <div class="env-band">
    <figure><img src="https://cms.perpetual.com.my/assets/images/heng-ding-lou/_banner1920X1078/22020/1920x1080-HDL-06.webp" alt="庭院与水景" loading="lazy"><figcaption>庭院与水景</figcaption></figure>
    <figure><img src="https://cms.perpetual.com.my/assets/images/product/plot-img2.jpg" alt="傍晚的园区" loading="lazy"><figcaption>户外园区</figcaption></figure>
    <figure><img src="https://cms.perpetual.com.my/assets/images/heng-ding-lou/1k_hDL81.jpg" alt="室内福位环境" loading="lazy"><figcaption>室内福位</figcaption></figure>
  </div>
</div>

<footer class="site-footer">
  Perpetual Memorial Park 万富山庄 · Kulai · Ulu Choh · Ipoh<br>
  <a href="https://www.perpetual.com.my" target="_blank" rel="noopener">perpetual.com.my</a>
</footer>

<script src="assets/pmp.js"></script>
<script>
(function(){
  var PAGE = "guide";
  document.getElementById("continue").addEventListener("click", function(){
    PMP.track("guide_continue", {page_type:PAGE});
  });
  PMP.decorateLinks();   /* carries UTMs through to index.html */
  PMP.track("landing_page_view", {page_type:PAGE});
})();
</script>
</body>
</html>
