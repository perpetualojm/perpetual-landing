<script src="assets/pmp.js?v=3"></script>
<script>
(function(){
  var PAGE = "price";
  var sel = { location:null, interest:null };
  function message(){
    var lines = ["您好，我想了解 Perpetual Memorial Park。"];
    if (sel.location) lines.push("园区：" + sel.location);
    if (sel.interest) lines.push("主要想了解：" + sel.interest);
    lines.push("请问可以发我目前的价格和配套资料吗？");
    return lines.join("\n");
  }
  function refresh(){ PMP.setWA(message(), PAGE); }
  PMP.initChips(function(key, val){
    sel[key] = val;
    if (key === "location"){
      document.getElementById("interest").hidden = (sel.location === null);
      if (val) PMP.track("location_selected", {page_type:PAGE, location:val});
    } else if (val){
      PMP.track("interest_selected", {page_type:PAGE, interest:val, location:sel.location || ""});
    }
    refresh();
  });
  PMP.initWAClicks(PAGE, function(){ return {page_type:PAGE, location:sel.location || "", interest:sel.interest || ""}; });
  PMP.initScrollDepth(PAGE);
  PMP.initSticky(document.querySelector(".hero"), null);
  PMP.decorateLinks();
  PMP.track("landing_page_view", {page_type:PAGE});
  refresh();
})();
</script>
</body>
