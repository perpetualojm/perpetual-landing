<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>不知道该从哪里开始？ | Perpetual Memorial Park</title>
<meta name="description" content="回答 2 个简单问题，我们帮您看看应该先了解什么。不需要留下电话或邮箱。">
<meta name="theme-color" content="#8A3200">
<link rel="icon" href="https://www.perpetual.com.my/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/pmp.css">
<style>
  body{display:flex;flex-direction:column;min-height:100svh}
  .top{padding:18px 20px 0;max-width:560px;margin:0 auto;width:100%}
  .top img{width:96px;height:auto;margin:0 auto 14px;mix-blend-mode:multiply}
  .progress{display:flex;align-items:center;gap:12px}
  .progress[hidden]{display:none}
  .bar{flex:1;height:4px;border-radius:99px;background:var(--pmp-line);overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:var(--ci-accent);border-radius:99px;transform:scaleX(0);transform-origin:left;transition:transform .4s ease}
  .count{font-size:12.5px;color:var(--ci-grey);font-variant-numeric:tabular-nums;white-space:nowrap}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:flex-start;width:100%;max-width:560px;margin:0 auto;padding:26px 20px 34px}
  .screen{display:none;animation:in .4s ease}
  .screen.active{display:block}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}}
  h1,h2{font-weight:500;color:var(--pmp-ink);font-size:clamp(23px,6.4vw,30px);line-height:1.45;margin-bottom:8px}
  .sub{font-size:15px;color:var(--ci-grey);margin-bottom:22px}
  .q{font-weight:500;color:var(--pmp-ink);font-size:17px;margin:6px 0 14px}
  .opts{display:grid;gap:12px;grid-template-columns:1fr 1fr}
  .opt{
    font-family:var(--font-ui);font-size:16px;font-weight:500;color:var(--pmp-ink);
    background:var(--pmp-paper);border:1px solid var(--pmp-line);border-radius:16px;
    box-shadow:var(--shadow-panel);min-height:64px;padding:14px 10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;text-align:center;
    transition:border-color .15s ease,background .15s ease,color .15s ease,transform .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:hover{border-color:var(--ci-accent)}
  .opt:active{transform:scale(.97)}
  .opt.picked{background:var(--ci-accent);border-color:var(--ci-accent);color:#fff}
  .link-btn{margin-top:20px;background:none;border:0;cursor:pointer;font-family:var(--font-ui);
    font-size:13.5px;color:var(--ci-grey);text-decoration:underline;text-underline-offset:3px}
  .link-btn[hidden]{display:none}
  /* result */
  .result-loc{font-weight:500;color:var(--ci-accent);font-size:clamp(24px,6.4vw,30px);margin:4px 0 16px}
  .checks{background:var(--pmp-paper);border:1px solid var(--pmp-line);border-radius:16px;
    box-shadow:var(--shadow-panel);padding:18px 20px;margin-bottom:22px}
  .checks li{list-style:none;padding:7px 0;font-size:15px;color:var(--pmp-ink);font-weight:500}
  .checks li::before{content:"✓  ";color:var(--ci-accent)}
  .btn-full{width:100%;font-size:16px;padding:1em}
  .reassure{margin-top:14px;font-size:13.5px;color:var(--ci-grey);text-align:center}
  footer{padding:20px;text-align:center;font-size:12.5px;color:var(--ci-grey)}
</style>
</head>
<body class="lattice">

<div class="top">
  <img src="assets/Perpetual_Logo_Vertical.jpg" alt="萬富 Perpetual Memorial Park">
  <div class="progress" id="progress" hidden>
    <div class="bar"><i id="bar-fill"></i></div>
    <span class="count" id="count">1 / 2</span>
  </div>
</div>

<main class="stage">

  <!-- Q1 (landing screen: headline + first question, no friction) -->
  <section class="screen active" data-screen="1">
    <h1>不知道该从哪里开始？</h1>
    <p class="sub">回答 2 个简单问题，我们帮您看看应该先了解什么。不需要留下电话或邮箱。</p>
    <p class="q">哪个地点对您比较方便？</p>
    <div class="opts" data-q="location">
      <button class="opt" type="button" data-value="Kulai 古来">Kulai 古来</button>
      <button class="opt" type="button" data-value="Ulu Choh 乌鲁槽">Ulu Choh 乌鲁槽</button>
      <button class="opt" type="button" data-value="Ipoh 怡保">Ipoh 怡保</button>
      <button class="opt" type="button" data-value="还不确定">还不确定</button>
    </div>
  </section>

  <!-- Q2 -->
  <section class="screen" data-screen="2">
    <p class="q">您现在最想知道什么？</p>
    <div class="opts" data-q="interest">
      <button class="opt" type="button" data-value="价格">价格</button>
      <button class="opt" type="button" data-value="环境">环境</button>
      <button class="opt" type="button" data-value="福位类型">福位类型</button>
      <button class="opt" type="button" data-value="付款方式">付款方式</button>
    </div>
    <button class="link-btn" type="button" data-back>← 上一题</button>
  </section>

  <!-- Optional -->
  <section class="screen" data-screen="3">
    <span class="eyebrow" style="margin-bottom:6px">可选</span>
    <p class="q">主要是为谁了解？</p>
    <div class="opts" data-q="who">
      <button class="opt" type="button" data-value="自己">自己</button>
      <button class="opt" type="button" data-value="父母">父母</button>
      <button class="opt" type="button" data-value="家人">家人</button>
      <button class="opt" type="button" data-value="先了解看看">先了解看看</button>
    </div>
    <button class="link-btn" type="button" id="skip">跳过这题 →</button>
    <button class="link-btn" type="button" data-back style="margin-left:14px">← 上一题</button>
  </section>

  <!-- RESULT -->
  <section class="screen" data-screen="result">
    <span class="eyebrow">根据您的选择</span>
    <div class="result-loc" id="result-loc"></div>
    <p class="q" style="margin-top:0">建议您先了解：</p>
    <ul class="checks" id="checks"></ul>
    <a class="btn btn-primary btn-full js-wa" id="wa-btn" href="#" target="_blank" rel="noopener" data-src="matcher_result">
      <svg class="wa" viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="M16 2.7C8.7 2.7 2.8 8.6 2.8 15.9c0 2.6.8 5 2.1 7.1L2.7 29.3l6.5-2.1c2 1.1 4.3 1.7 6.8 1.7 7.3 0 13.2-5.9 13.2-13.2S23.3 2.7 16 2.7z"/><path fill="#BA4A00" d="M12.1 9.6c-.3-.7-.6-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5s-1.4 1.4-1.4 3.4 1.5 3.9 1.7 4.2c.2.3 2.9 4.6 7.1 6.3 3.5 1.4 4.2 1.1 5 1s2.4-1 2.7-1.9c.3-1 .3-1.8.2-1.9-.1-.2-.4-.3-.8-.5s-2.4-1.2-2.8-1.3c-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.3 1.6-.2.3-.5.3-.9.1-.4-.2-1.7-.6-3.3-2-1.2-1.1-2-2.4-2.3-2.8-.2-.4 0-.6.2-.8l.6-.7c.2-.2.3-.4.4-.7.1-.3.1-.5 0-.7-.1-.2-.9-2.2-1.2-3z"/></svg>
      查看目前选择 →
    </a>
    <p class="reassure">不用马上决定，先了解清楚就好。</p>
    <button class="link-btn" type="button" id="restart" style="display:block;margin:16px auto 0">重新选择</button>
  </section>

</main>

<footer>Perpetual Memorial Park 万富山庄 · Kulai · Ulu Choh · Ipoh</footer>

<script src="assets/pmp.js"></script>
<script>
(function(){
  var PAGE = "matcher";
  var answers = { location:null, interest:null, who:null };
  var current = "1", started = false;

  function show(id){
    current = id;
    document.querySelectorAll(".screen").forEach(function(s){
      s.classList.toggle("active", s.dataset.screen === id);
    });
    var prog = document.getElementById("progress");
    if (id === "1" || id === "2"){
      prog.hidden = false;
      document.getElementById("bar-fill").style.transform = "scaleX(" + (Number(id)/2) + ")";
      document.getElementById("count").textContent = id + " / 2";
    } else if (id === "3"){
      prog.hidden = false;
      document.getElementById("bar-fill").style.transform = "scaleX(1)";
      document.getElementById("count").textContent = "可选";
    } else {
      prog.hidden = true;
    }
    window.scrollTo({top:0});
  }

  function message(){
    var lines = ["您好，我想了解 Perpetual Memorial Park。"];
    if (answers.location) lines.push("园区：" + answers.location);
    if (answers.interest) lines.push("最想了解：" + answers.interest);
    if (answers.who) lines.push("为：" + (answers.who === "先了解看看" ? "先了解看看" : answers.who + "了解"));
    lines.push("请问可以发我目前的选择和资料吗？");
    return lines.join("\n");
  }

  /* real mini result: interest-first checklist, adapted to location certainty */
  var ITEM = { "价格":"价格与配套", "环境":"园区环境", "福位类型":"目前可选择的福位类型", "付款方式":"付款方式" };
  function buildResult(){
    var undecided = (answers.location === "还不确定" || !answers.location);
    document.getElementById("result-loc").textContent =
      undecided ? "还没确定地点，也没关系。" : answers.location;
    var items = [];
    if (answers.interest && ITEM[answers.interest]) items.push(ITEM[answers.interest]);
    ["目前可选择的福位类型","价格与配套","园区环境"].forEach(function(x){
      if (items.indexOf(x) === -1 && items.length < 3) items.push(x);
    });
    if (undecided) items.unshift("各园区的距离与环境比较");
    document.getElementById("checks").innerHTML =
      items.slice(0,4).map(function(t){ return "<li>" + t + "</li>"; }).join("");
    PMP.setWA(message(), PAGE);
  }

  function advance(from){
    if (from === "1") show("2");
    else if (from === "2") show("3");
    else {
      PMP.track("matcher_completed", {page_type:PAGE, location:answers.location,
        interest:answers.interest, who:answers.who || ""});
      buildResult(); show("result");
    }
  }

  document.querySelectorAll(".opts").forEach(function(group){
    var key = group.dataset.q;
    var screen = group.closest(".screen").dataset.screen;
    group.addEventListener("click", function(e){
      var opt = e.target.closest(".opt");
      if (!opt) return;
      if (!started){ started = true; PMP.track("matcher_started", {page_type:PAGE}); }
      group.querySelectorAll(".opt").forEach(function(o){ o.classList.remove("picked"); });
      opt.classList.add("picked");
      answers[key] = opt.dataset.value;
      if (key === "location") PMP.track("location_selected", {page_type:PAGE, location:opt.dataset.value});
      if (key === "interest") PMP.track("interest_selected", {page_type:PAGE, interest:opt.dataset.value, location:answers.location || ""});
      setTimeout(function(){ advance(screen); }, 280);
    });
  });

  document.getElementById("skip").addEventListener("click", function(){ advance("3"); });
  document.querySelectorAll("[data-back]").forEach(function(b){
    b.addEventListener("click", function(){ show(current === "3" ? "2" : "1"); });
  });
  document.getElementById("restart").addEventListener("click", function(){
    answers = { location:null, interest:null, who:null };
    document.querySelectorAll(".opt").forEach(function(o){ o.classList.remove("picked"); });
    show("1");
  });

  PMP.initWAClicks(PAGE, function(){
    return {page_type:PAGE, location:answers.location || "", interest:answers.interest || ""};
  });
  PMP.decorateLinks();
  PMP.track("landing_page_view", {page_type:PAGE});
})();
</script>
</body>
</html>
